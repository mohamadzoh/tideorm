[package]
name = "tideorm-macros"
version = "0.2.0"
edition = "2024"
description = "Procedural macros for TideORM"
license = "MIT"
repository = "https://github.com/mohamadzoh/tideorm"
readme = "../README.md"
rust-version = "1.85"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits", "parsing"] }
darling = "0.23"
convert_case = "0.10"
