name: Release

on:
  push:
    tags:
      - v*

env:
  RUSTFLAGS: -Dwarnings

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-dry-run:
    name: Publish Dry Run
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo publish tideorm-macros --dry-run
        run: cargo publish -p tideorm-macros --dry-run
      - name: cargo publish tideorm --dry-run
        run: cargo publish -p tideorm --dry-run

