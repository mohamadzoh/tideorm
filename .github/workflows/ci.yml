name: CI

on:
  push:
    branches:
      - master
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  fmt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # `rust-version = "1.94"` in both manifests is a promise to downstream
  # resolvers, and every other job installs `stable`, so nothing else here would
  # notice a post-1.94 API landing. This job is the only thing that checks it.
  #
  # The floor is not ours to pick: `sea-orm` 2.x declares `rust-version =
  # "1.94.0"`, and `resolver = "3"` refuses to build a tree whose dependencies
  # require more than the running toolchain. This job therefore fails on a
  # dependency bump just as readily as on our own code.
  #
  # Deliberately `cargo check` and not `--all-targets`: the MSRV covers the
  # published library and proc-macro crate, not the dev-dependencies
  # (criterion, trybuild, tokio) that only contributors build. The module
  # features are on because they gate real code that the default feature set
  # never compiles.
  #
  # When this job fails, the fix is to raise `rust-version` in `Cargo.toml` and
  # `tideorm-macros/Cargo.toml` together, not to relax the job. CONTRIBUTING.md
  # lists the five places that have to move in the same change.
  msrv:
    runs-on: ubuntu-latest
    env:
      MODULE_FEATURES: "attachments,translations,fulltext,entity-manager,dirty-tracking,encrypted-fields"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        # Keep this literal in sync with `rust-version` in both manifests.
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check against the declared MSRV
        run: cargo check --workspace --features "$MODULE_FEATURES"

  # The six module feature flags gate real code but are off by default, so the
  # `clippy` and `test` jobs above never compile them. Lint and unit-test them
  # here, together with the non-default async-std runtime.
  features:
    runs-on: ubuntu-latest
    env:
      MODULE_FEATURES: "attachments,translations,fulltext,entity-manager,dirty-tracking,encrypted-fields"
      POSTGRESQL_DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_tide_orm

    # `cargo test --lib` is otherwise database-free, but the entity-manager
    # relation tests under `tests/unit/` are `#[path]`-included into it and speak
    # real PostgreSQL (`BIGSERIAL`, `... CASCADE`). They run only when a
    # PostgreSQL URL is set, and only compile under `entity-manager`, which is
    # why this job sets one and has a database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_tide_orm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run clippy with module features
        run: cargo clippy --workspace --all-targets --features "$MODULE_FEATURES" -- -D warnings

      - name: Test with module features
        run: cargo test --lib --features "$MODULE_FEATURES"

      # Unit tests that need both the SQLite driver and a module feature, and
      # the public API's feature-gated tests, which no other job builds.
      - name: Test with module features on SQLite
        run: cargo test --lib --features "sqlite,$MODULE_FEATURES"

      - name: Test the public API with module features
        run: cargo test --test public_api_tests --features "$MODULE_FEATURES"

      - name: Check async-std runtime
        run: cargo check --no-default-features --features sqlite,runtime-async-std

  macros:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test tideorm-macros
        run: cargo test -p tideorm-macros --lib

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature-set:
          - "--no-default-features --features postgres,runtime-tokio"
          - "--no-default-features --features mysql,runtime-tokio"
          - "--no-default-features --features sqlite,runtime-tokio"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check ${{ matrix.feature-set }}

      - name: Test
        run: cargo test --lib ${{ matrix.feature-set }}

  integration-sqlite:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run SQLite integration test
        run: cargo test --package tideorm --test sqlite_ci_smoke_test --no-default-features --features sqlite,runtime-tokio

      # The shared scenarios in tests/support/*_parity.rs, run on SQLite; the
      # PostgreSQL, MySQL and MariaDB jobs below run the same bodies against a
      # server.
      - name: Run SQLite integration and entity-manager suites
        run: |
          cargo test --package tideorm --test sqlite_integration_tests --no-default-features --features sqlite,runtime-tokio
          cargo test --package tideorm --test sqlite_entity_manager_tests --no-default-features --features sqlite,runtime-tokio,entity-manager

  # Integration targets that never touch a database. Targets are named
  # explicitly rather than using `--tests`, because the postgres, mysql and
  # mariadb integration targets all need a live server.
  tests-no-db:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run database-free integration tests
        run: |
          cargo test --package tideorm \
            --test public_api_tests \
            --test edge_case_tests \
            --test typed_columns_and_join_tests \
            --test tokenization_tests \
            --test tokenization_missing_key_test \
            --test relation_serde_tests

      # or_clause_tests pulls in a Postgres-backed module behind
      # `feature = "postgres"`, so run it with the sqlite feature set instead.
      - name: Run OR clause tests
        run: cargo test --package tideorm --test or_clause_tests --no-default-features --features sqlite,runtime-tokio

      # trybuild suites: the only real check on the tideorm/tideorm-macros ABI.
      - name: Run compile-fail tests
        run: cargo test --package tideorm --test relation_compile_fail --test encrypted_fields_feature_compile_fail

  # The live-database suites: the shared scenarios, PostgreSQL's advanced and
  # fluent-OR tests, and the entity-manager suite, against a real server. They
  # are opt-in, and the URL is what turns them on.
  integration-postgres:
    runs-on: ubuntu-latest
    env:
      POSTGRESQL_DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_tide_orm

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_tide_orm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run PostgreSQL suites
        run: |
          cargo test --package tideorm --test postgres_integration_tests
          cargo test --package tideorm --test postgres_advanced_tests
          cargo test --package tideorm --test or_clause_tests
          cargo test --package tideorm --test postgres_entity_manager_tests --features entity-manager

  integration-mysql:
    runs-on: ubuntu-latest
    env:
      MYSQL_DATABASE_URL: mysql://root@127.0.0.1:3306/test_tide_orm

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: test_tide_orm
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run MySQL suites
        run: |
          cargo test --package tideorm --test mysql_integration_tests --no-default-features --features mysql,runtime-tokio
          cargo test --package tideorm --test mysql_entity_manager_tests --no-default-features --features mysql,runtime-tokio,entity-manager

  # MariaDB speaks MySQL's protocol but differs under it: no `CAST(.. AS JSON)`
  # or `LAG` default, JSON columns declared as text, `TIMESTAMP` parameters
  # checked against that type's range. The oldest and newest supported LTS lines.
  integration-mariadb:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mariadb: ["10.11", "12.3"]
    env:
      MARIADB_DATABASE_URL: mysql://root@127.0.0.1:3306/test_tide_orm

    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
          MARIADB_DATABASE: test_tide_orm
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run MariaDB suites
        run: |
          cargo test --package tideorm --test mariadb_integration_tests --no-default-features --features mysql,runtime-tokio
          cargo test --package tideorm --test mariadb_entity_manager_tests --no-default-features --features mysql,runtime-tokio,entity-manager

  docs:
    runs-on: ubuntu-latest
    env:
      # Keep in sync with .github/workflows/mdbook.yml, otherwise a book can
      # pass this gate and then fail the post-merge Pages deploy.
      MDBOOK_VERSION: 0.4.36

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@${{ env.MDBOOK_VERSION }}

      - name: Build book
        run: mdbook build