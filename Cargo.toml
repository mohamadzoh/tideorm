[package]
name = "tideorm"
version = "0.17.6"
edition = "2024"
authors = ["Mohamad Al Zohbie <alzoubi528@gmail.com>"]
description = "A developer-friendly ORM for Rust with clean, expressive syntax"
license = "MIT"
repository = "https://github.com/mohamadzoh/tideorm"
homepage = "https://tideorm.com"
documentation = "https://docs.rs/tideorm"
keywords = ["orm", "database", "postgres", "mysql", "sqlite"]
categories = ["database"]
readme = "README.md"
# Declared MSRV, and what downstream resolvers see. It is set by the dependency
# tree, not by the edition floor: `resolver = "3"` refuses to build against a
# dependency that wants more than the running toolchain.
# The `msrv` job in .github/workflows/ci.yml pins this exact toolchain and runs
# `cargo check`, so a post-1.94 API cannot land unnoticed. Raising this touches
# eight places — see the MSRV bullet in CONTRIBUTING.md, which lists them; a bump
# also switches on MSRV-gated clippy lints, so re-run clippy after one.
rust-version = "1.94"
# `tests/unit/**` and `tests/support/**` are `#[path]`-included into `src/`, so a
# blanket `tests/**` exclusion makes `cargo test --lib` fail inside an extracted
# `.crate`. Keep those two trees and drop only the standalone integration
# targets, which need live databases and cannot run from a published tarball.
# `.cargo/config.toml` ships too: it runs those tests on one thread, as they
# need, and cargo reads it only inside the extracted crate, never for a build
# that depends on it.
exclude = [
    ".claude/settings.local.json",
    ".github/**",
    ".env.example",
    "book.toml",
    "docs/CNAME",
    "tests/*.rs",
    "tests/edge_case/**",
    "tests/or_clause/**",
    "tests/project_rules/**",
    "tests/sqlite_ci_smoke_test/**",
    "tests/sqlite_regressions/**",
    "tests/typed_columns_and_join_tests/**",
    "tests/ui/**",
    "tests/public_api_tests/**",
]

# docs.rs builds the default features only, which would leave every API behind a
# module flag, and the MySQL and SQLite connect options, undocumented.
[package.metadata.docs.rs]
features = ["mysql", "sqlite", "attachments", "translations", "fulltext", "entity-manager", "dirty-tracking", "encrypted-fields"]

[workspace]
members = [".", "tideorm-macros"]
resolver = "3"

[features]
default = ["postgres", "runtime-tokio"]
postgres = ["tideorm-engine/postgres", "tideorm-macros/postgres"]
mysql = ["tideorm-engine/mysql"]
# The SQLite driver builds its bundled SQLite (3.46 or later), which has `RETURNING`, so the
# engine's `sqlite` feature writes an insert or update as one statement instead of
# the write plus a `SELECT` of the row.
sqlite = ["tideorm-engine/sqlite", "dep:async-io"]
runtime-tokio = ["tideorm-engine/runtime-tokio", "dep:tokio"]
runtime-async-std = ["tideorm-engine/runtime-async-std", "dep:async-std"]
# These module flags intentionally gate TideORM's public API surface via #[cfg(feature = ...)]
# and feature-specific tests/benches only. They do not enable extra dependencies.
attachments = []
translations = []
fulltext = []
entity-manager = []
dirty-tracking = []
encrypted-fields = []

[dependencies]
# The execution engine, from its own repository (rust-ocean/tideorm-engine).
# `src/orm.rs` re-exports it, with the ORM derive macros from `tideorm-macros`,
# and macro-generated models reach both through that module's paths.
tideorm-engine = { version = "0.1.4", default-features = false }

# Async runtime
async-trait = "0.1.92"
# Runtime-independent, cancellable timers for SQLite migration lock waits.
async-io = { version = "2.6.0", optional = true }
# The current task's id, which keeps one task's dirty-tracking baselines apart
# from another's. The drivers already build both for the same runtime feature.
tokio = { version = "1.54.1", default-features = false, features = ["rt"], optional = true }
async-std = { version = "1.13.2", optional = true }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Types
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.29.0", features = ["serde", "v4"] }
rust_decimal = { version = "1.43.0", features = ["serde"] }

# Error handling
thiserror = "2.0.21"

# Derive macros (our own crate)
tideorm-macros = { version = "=0.17.6", path = "tideorm-macros" }

# Utils
parking_lot = "0.12.5"
# An async mutex that works on either runtime; the engine already builds this crate.
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
inventory = "0.3.25"
regex = "1.13.1"
url = "2.5.8"
chacha20poly1305 = "0.11.0"
argon2 = "0.6.0"
blake2 = { version = "0.11.0", default-features = false }

[dev-dependencies]
async-std = "1.13.2"
tokio = { version = "1.54.1", features = ["full"] }
criterion = { version = "0.8.2", features = ["async_tokio"] }
dotenvy = "0.15.7"
trybuild = "1.0.122"

# Benchmarks. A bare `cargo bench` is not meaningful: the targets below carry
# `required-features` for the driver they actually open a connection with, and
# the PostgreSQL-backed ones additionally need a live server. Run them
# individually - see CONTRIBUTING.md and docs/benchmarking.md.
[[bench]]
name = "crud_benchmarks"
harness = false
required-features = ["postgres", "runtime-tokio"]

[[bench]]
name = "query_benchmarks"
harness = false
required-features = ["postgres", "runtime-tokio"]

[[bench]]
name = "attachments_translations_benchmarks"
harness = false
required-features = ["attachments", "translations"]

[[bench]]
name = "cache_benchmarks"
harness = false
required-features = ["sqlite", "runtime-tokio"]

[[bench]]
name = "stability_benchmarks"
harness = false

[[bench]]
name = "validation_benchmarks"
harness = false

[[bench]]
name = "fulltext_benchmarks"
harness = false
required-features = ["fulltext"]

[[bench]]
name = "relations_benchmarks"
harness = false

[[bench]]
name = "or_clause_benchmarks"
harness = false
required-features = ["postgres", "runtime-tokio"]

[[bench]]
name = "tokenization_benchmarks"
harness = false

[[test]]
name = "sqlite_ci_smoke_test"
path = "tests/sqlite_ci_smoke_test.rs"
required-features = ["sqlite", "runtime-tokio"]

[[test]]
name = "async_std_runtime"
path = "tests/async_std_runtime.rs"
required-features = ["sqlite", "runtime-async-std"]

[[test]]
name = "sqlite_integration_tests"
path = "tests/sqlite_integration_tests.rs"
required-features = ["sqlite", "runtime-tokio"]

# Builds tests/project_rules/ with cargo against this checkout.
[[test]]
name = "project_rules"
path = "tests/project_rules.rs"
required-features = ["sqlite", "runtime-tokio"]

[[test]]
name = "postgres_integration_tests"
path = "tests/postgres_integration_tests.rs"
required-features = ["postgres", "runtime-tokio"]

[[test]]
name = "mysql_integration_tests"
path = "tests/mysql_integration_tests.rs"
required-features = ["mysql", "runtime-tokio"]

[[test]]
name = "mariadb_integration_tests"
path = "tests/mariadb_integration_tests.rs"
required-features = ["mysql", "runtime-tokio"]

# The entity-manager suites carry an inner `#![cfg(...)]`. Without these
# stanzas cargo always builds them and they report a green "0 passed" instead
# of being skipped; `required-features` makes the skip visible.
[[test]]
name = "postgres_entity_manager_tests"
path = "tests/postgres_entity_manager_tests.rs"
required-features = ["postgres", "runtime-tokio", "entity-manager"]

[[test]]
name = "sqlite_entity_manager_tests"
path = "tests/sqlite_entity_manager_tests.rs"
required-features = ["sqlite", "runtime-tokio", "entity-manager"]

[[test]]
name = "mysql_entity_manager_tests"
path = "tests/mysql_entity_manager_tests.rs"
required-features = ["mysql", "runtime-tokio", "entity-manager"]

[[test]]
name = "mariadb_entity_manager_tests"
path = "tests/mariadb_entity_manager_tests.rs"
required-features = ["mysql", "runtime-tokio", "entity-manager"]

# Standalone, runnable learning examples.
[[example]]
name = "crud"
required-features = ["sqlite", "runtime-tokio"]

[[example]]
name = "relations"
required-features = ["sqlite", "runtime-tokio"]

[[example]]
name = "transactions"
required-features = ["sqlite", "runtime-tokio"]

[[example]]
name = "migrations"
required-features = ["sqlite", "runtime-tokio"]

[[example]]
name = "scopes"
required-features = ["sqlite", "runtime-tokio"]

[[example]]
name = "postgres"
required-features = ["postgres", "runtime-tokio"]
